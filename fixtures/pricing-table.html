<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pricing table</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 1100px; font-family: Inter, system-ui, sans-serif; background: #fff; color: #111827; }
      .shell { padding: 56px 40px; display: flex; flex-direction: column; align-items: center; gap: 36px; }
      h1 { margin: 0; font-size: 32px; }
      table { border-collapse: collapse; width: 1000px; }
      caption { caption-side: top; text-align: left; padding-bottom: 12px; color: #6b7280; font-size: 14px; }
      th, td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
      thead th { border-bottom: 2px solid #111827; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
      tbody tr:nth-child(even) { background: #f9fafb; }
      td.price { font-weight: 600; }
      .tier { display: flex; flex-direction: column; gap: 2px; }
      .tier small { color: #6b7280; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 11px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Plans</h1>
      <table>
        <caption>Billed annually. Prices exclude tax.</caption>
        <thead>
          <tr><th>Plan</th><th>Seats</th><th>Storage</th><th>Support</th><th>Price</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><div class="tier">Starter<small>For solo work</small></div></td>
            <td>1</td><td>5 GB</td><td>Community</td><td class="price">$0</td>
          </tr>
          <tr>
            <td><div class="tier">Team <span class="badge">Popular</span><small>Small studios</small></div></td>
            <td>10</td><td>100 GB</td><td>Email, 1 day</td><td class="price">$24</td>
          </tr>
          <tr>
            <td><div class="tier">Business<small>Growing product teams</small></div></td>
            <td>50</td><td>1 TB</td><td>Email, 4 hours</td><td class="price">$79</td>
          </tr>
          <tr>
            <td><div class="tier">Enterprise<small>Procurement friendly</small></div></td>
            <td>Unlimited</td><td>Unlimited</td><td>Named contact</td><td class="price">Contact us</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
